name: Feature request
description: Suggest an idea for Openfolio or Openfolio Cloud
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who runs into it (owners, recruiters, visitors, self-hosters) and when?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this (merged pull requests earn Openfolio Cloud credits; see CONTRIBUTING.md)
