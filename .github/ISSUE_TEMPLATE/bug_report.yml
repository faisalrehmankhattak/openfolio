name: Bug report
description: Something in Openfolio doesn't work as it should
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include API keys, passwords or other people's personal data.
        Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click Talk ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Self-hosted server
        - Openfolio Cloud
        - Widget embedded on my site
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on macOS, Safari on iPhone 15 ...
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: Server logs (docker compose logs) or the browser console. Remove secrets first.
      render: text
