{% macro mark(size=28, uid="h") %}
<svg class="mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <defs><linearGradient id="of-mark-{{ uid }}" x1="6" y1="26" x2="26" y2="6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#128a6a"/><stop offset="1" stop-color="#5fd6ad"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="#17202b"/>
  <path d="M24.41 14.21A8.6 8.6 0 1 1 17.79 7.59" fill="none" stroke="url(#of-mark-{{ uid }})" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="23.35" cy="8.65" r="2.7" fill="#5fd6ad"/>
</svg>
{%- endmacro %}
