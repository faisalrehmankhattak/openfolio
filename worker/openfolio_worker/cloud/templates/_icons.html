{# Inline SVG icons: presentation attributes only, so they pass the strict CSP. #}
{% macro icon(name, size=20) %}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == "mic" %}<path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
{% elif name == "chat" %}<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 4V6a1 1 0 0 1 1-1z"/>
{% elif name == "tag" %}<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>
{% elif name == "book" %}<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7M8 11h5"/>
{% elif name == "globe" %}<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>
{% elif name == "pause" %}<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>
{% elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{% elif name == "alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>
{% elif name == "arrow" %}<path d="M5 12h14M13 6l6 6-6 6"/>
{% elif name == "lock" %}<rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
{% elif name == "link" %}<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/>
{% elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>
{% elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
{% elif name == "logout" %}<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l-4-4 4-4M6 12h10"/>
{% elif name == "x" %}<path d="M6 6l12 12M18 6L6 18"/>
{% elif name == "user" %}<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>
{% elif name == "play" %}<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/>
{% elif name == "upload" %}<path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
{% elif name == "file" %}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
{% elif name == "trash" %}<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>
{% elif name == "eye" %}<path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"/><circle cx="12" cy="12" r="3"/>
{% elif name == "copy" %}<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
{% elif name == "download" %}<path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
{% elif name == "image" %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>
{% elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{% elif name == "edit" %}<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
{% elif name == "shield" %}<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{% elif name == "code" %}<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>
{% elif name == "sparkle" %}<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>
{% endif %}
</svg>
{%- endmacro %}

{% macro mark(size=28) %}
<svg class="mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <defs><linearGradient id="of-mark-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc79f"/><stop offset="1" stop-color="#128a6a"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="#17202b"/>
  <circle cx="16" cy="16" r="8.5" fill="none" stroke="url(#of-mark-g)" stroke-width="3.2"/>
  <circle cx="22.5" cy="9.5" r="2.6" fill="#4cc79f"/>
</svg>
{%- endmacro %}
