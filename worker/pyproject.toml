[project]
name = "openfolio-worker"
version = "0.2.0"
description = "Openfolio, the open-source AI portfolio builder: a 3D AI version of you that talks to recruiters by voice or chat."
license = "Apache-2.0"
authors = [{ name = "Faisal Rehman" }]
requires-python = ">=3.11,<3.14"
keywords = [
  "ai-portfolio", "ai-portfolio-builder", "portfolio-builder", "personal-portfolio", "portfolio-website",
  "ai-twin", "digital-twin", "ai-avatar", "3d-avatar", "talking-head", "voice-agent", "recruiting",
  "conversational-ai", "llm", "pipecat", "webrtc", "self-hosted", "open-source",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pipecat-ai[webrtc,deepgram,elevenlabs,kokoro,openai,silero]==1.13.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "loguru>=0.7",
  "httpx>=0.27",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/faisalrehmankhattak/openfolio"
Repository = "https://github.com/faisalrehmankhattak/openfolio"
Issues = "https://github.com/faisalrehmankhattak/openfolio/issues"

[project.optional-dependencies]
whisper = ["pipecat-ai[whisper]==1.13.0"]

[project.scripts]
openfolio-worker = "openfolio_worker.server:main"
openfolio-doctor = "openfolio_worker.doctor:main"
openfolio-schema = "openfolio_worker.persona:main"
openfolio-admin-hash = "openfolio_worker.cloud.auth:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openfolio_worker"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PT", "RET", "C4"]
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["openfolio_worker"]
known-local-folder = ["conftest", "cloud_helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"openfolio_worker/persona.py" = ["E501"]  # the prompt template reads better unwrapped

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
files = ["openfolio_worker"]

# Pipecat ships partial types: subclassing its processors and its event decorators stay untyped.
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
