[project]
name = "openfolio-worker"
version = "0.1.0"
description = "Openfolio voice worker: talk to a 3D AI version of a person, from one embed."
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pipecat-ai[webrtc,deepgram,elevenlabs,kokoro,openai,silero]==1.13.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
  "loguru>=0.7",
]

[project.optional-dependencies]
whisper = ["pipecat-ai[whisper]==1.13.0"]

[project.scripts]
openfolio-worker = "openfolio_worker.server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openfolio_worker"]
